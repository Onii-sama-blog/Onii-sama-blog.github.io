<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onii-sama blog</title>
<style>
:root {
  --bg: #0f1115; --bg-elevated: #171a1f; --header-bg: rgba(15,17,21,0.92); --fg: #e8eaed; --muted: #8b919a;
  --accent: #00d4aa; --accent-dim: #00d4aa33; --danger: #ff4757; --warning: #ffa502;
  --border: #2a2f3a; --card: #13161b; --input-bg: #0d1014; --focus: #00d4aa;
  --radius: 12px; --radius-sm: 8px; --transition: 0.2s ease;
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #f8f9fa; --bg-elevated: #ffffff; --header-bg: rgba(255,255,255,0.92); --fg: #1a1d21; --muted: #5c6370;
    --accent: #00b894; --accent-dim: #00b89422; --danger: #e84118; --warning: #e67700;
    --border: #e1e4e8; --card: #ffffff; --input-bg: #f1f3f5; --focus: #00b894; }
}
:root[data-theme="light"] {
  --bg: #f8f9fa; --bg-elevated: #ffffff; --header-bg: rgba(255,255,255,0.92); --fg: #1a1d21; --muted: #5c6370;
  --accent: #00b894; --accent-dim: #00b89422; --danger: #e84118; --warning: #e67700;
  --border: #e1e4e8; --card: #ffffff; --input-bg: #f1f3f5; --focus: #00b894;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--fg); line-height: 1.6; min-height: 100vh; transition: background var(--transition), color var(--transition); }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: 1rem; background: var(--input-bg); border: 1px solid var(--border); color: var(--fg); padding: 0.75rem 1rem; border-radius: var(--radius-sm); width: 100%; transition: border-color var(--transition), box-shadow var(--transition); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-dim); }
label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--fg); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
.btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: var(--radius-sm); font-weight: 600; transition: all var(--transition); }
.btn-primary { background: var(--accent); color: #000; } .btn-primary:hover { filter: brightness(1.1); }
.btn-secondary { background: var(--bg-elevated); color: var(--fg); border: 1px solid var(--border); } .btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--danger); color: #fff; } .btn-danger:hover { filter: brightness(1.1); }
.btn-ghost { color: var(--muted); } .btn-ghost:hover { color: var(--fg); }
.container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
.header { position: sticky; top: 0; z-index: 100; background: var(--header-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 0.75rem; }
.header-actions { display: flex; align-items: center; gap: 0.5rem; }
.logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; white-space: nowrap; }
.nav { display: flex; align-items: center; gap: 0.5rem; }
.nav a { position: relative; padding: 0.5rem 0.9rem; border-radius: var(--radius-sm); color: var(--muted); font-weight: 500; transition: color 0.2s ease, background 0.2s ease, transform 0.15s ease; }
.nav a::after { content: ''; position: absolute; left: 0.9rem; right: 0.9rem; bottom: 4px; height: 2px; border-radius: 2px; background: var(--accent); transform: scaleX(0); transform-origin: center; transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1); }
.nav a:hover { color: var(--fg); background: var(--accent-dim); text-decoration: none; }
.nav a:active { transform: scale(0.96); }
.nav a.active { color: var(--accent); background: var(--accent-dim); font-weight: 600; text-decoration: none; }
.nav a.active::after { transform: scaleX(1); }
@keyframes pageEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.page-enter { animation: pageEnter 0.24s cubic-bezier(0.22, 1, 0.36, 1); }
.icon-btn { width: 40px; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elevated); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; font-size: 1.15rem; transition: all var(--transition); }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.mobile-menu-btn { display: none; }
@media (max-width: 768px) {
  .container { padding: 0 1rem; }
  .main { padding: 1.5rem 0; }
  .nav { display: none; position: absolute; top: 64px; left: 0; right: 0; background: var(--bg-elevated); border-bottom: 1px solid var(--border); flex-direction: column; padding: 0.75rem 1rem 1rem; gap: 0.25rem; box-shadow: 0 12px 32px rgba(0,0,0,0.25); z-index: 200; }
  .nav.open { display: flex; }
  .nav a { width: 100%; text-align: left; padding: 0.75rem 1rem; border-radius: var(--radius-sm); color: var(--fg); }
  .nav #logout-btn { width: 100%; justify-content: center; margin-top: 0.5rem; }
  .mobile-menu-btn { display: inline-flex; }
  .admin-layout { grid-template-columns: 1fr; }
  .admin-sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 0.75rem 1rem; }
  .admin-sidebar-title { display: none; }
  .admin-nav { flex-direction: row; overflow-x: auto; gap: 0.4rem; padding-bottom: 0.25rem; -webkit-overflow-scrolling: touch; }
  .admin-nav a { white-space: nowrap; padding: 0.55rem 0.85rem; font-size: 0.9rem; border: 1px solid var(--border); }
  .admin-main { padding: 1.25rem 1rem; }
  .admin-header h1 { font-size: 1.4rem; }
  .toast-container { left: 1rem; right: 1rem; bottom: 1rem; }
  .toast { min-width: 0; max-width: 100%; width: 100%; }
}
.main { padding: 3rem 0; }
.section-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
.section-title::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); }
.post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 1.5rem; }
.post-card { display: flex; flex-direction: column; transition: transform var(--transition), box-shadow var(--transition); }
.post-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.3); }
.post-card img { width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius) var(--radius) 0 0; background: var(--bg-elevated); }
.post-card-content { flex: 1; display: flex; flex-direction: column; padding: 1.25rem; }
.post-card-meta { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; flex-wrap: wrap; }
.post-card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.3; }
.post-card-excerpt { color: var(--muted); font-size: 0.95rem; flex: 1; margin-bottom: 1rem; }
.post-card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--muted); }
.single-post { max-width: 800px; margin: 0 auto; }
.post-header { margin-bottom: 2rem; }
.post-title { font-size: clamp(1.75rem, 4vw, 2.75rem); font-weight: 800; line-height: 1.2; margin-bottom: 1rem; }
.post-meta { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.9rem; color: var(--muted); }
.post-cover { width: 100%; max-height: 400px; object-fit: cover; border-radius: var(--radius); margin-bottom: 2rem; background: var(--bg-elevated); }
.post-content { font-size: 1.1rem; line-height: 1.8; }
.post-content h2 { margin: 2rem 0 1rem; font-size: 1.5rem; }
.post-content p { margin-bottom: 1.25rem; }
.post-content img { max-width: 100%; border-radius: var(--radius); margin: 1.5rem 0; }
.post-content pre { background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; overflow-x: auto; margin: 1.5rem 0; }
.post-content code { font-family: var(--font-mono); font-size: 0.9em; background: var(--accent-dim); padding: 0.15rem 0.4rem; border-radius: 4px; }
.post-content pre code { background: none; padding: 0; }
.post-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border); }
.tag { background: var(--accent-dim); color: var(--accent); padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8rem; font-weight: 500; }
.comments-section { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); }
.comment-form { margin-bottom: 2rem; }
.comment-form textarea { min-height: 100px; resize: vertical; }
.comment-list { display: flex; flex-direction: column; gap: 1rem; }
.comment { padding: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
.comment-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; font-size: 0.9rem; }
.comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; flex-shrink: 0; }
.comment-avatar img, .profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.admin-layout { display: grid; grid-template-columns: 260px 1fr; gap: 0; min-height: calc(100vh - 64px); }
.admin-sidebar { background: var(--bg-elevated); border-right: 1px solid var(--border); padding: 1.5rem; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
.admin-sidebar-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 1rem; font-weight: 700; }
.admin-nav { display: flex; flex-direction: column; gap: 0.25rem; }
.admin-nav a { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: var(--radius-sm); color: var(--muted); font-weight: 500; transition: all var(--transition); }
.admin-nav a:hover, .admin-nav a.active { background: var(--accent-dim); color: var(--accent); text-decoration: none; }
.admin-main { padding: 2rem; }
.admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.stat-card { display: flex; align-items: center; gap: 1rem; }
.stat-icon { width: 48px; height: 48px; border-radius: var(--radius); background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
.stat-info h3 { font-size: 0.8rem; color: var(--muted); font-weight: 500; margin-bottom: 0.25rem; }
.stat-info p { font-size: 1.75rem; font-weight: 700; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { padding: 0.875rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
th { font-weight: 600; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
tr:hover td { background: var(--bg-elevated); }
.badge { display: inline-flex; align-items: center; padding: 0.25rem 0.625rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
.badge-published { background: var(--accent-dim); color: var(--accent); }
.badge-draft { background: var(--border); color: var(--muted); }
.badge-admin { background: #5865f222; color: #5865f2; }
.badge-editor { background: #ffa50222; color: #ffa502; }
.action-btns { display: flex; gap: 0.5rem; }
.action-btn { padding: 0.4rem 0.75rem; border-radius: var(--radius-sm); font-size: 0.8rem; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; animation: slideUp 0.2s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 1.15rem; font-weight: 700; }
.modal-close { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); } .modal-close:hover { background: var(--border); color: var(--fg); }
.modal-body { padding: 1.5rem; }
.form-group { margin-bottom: 1.25rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
.modal-footer { display: flex; justify-content: flex-end; gap: 0.75rem; padding: 1.25rem 1.5rem; border-top: 1px solid var(--border); }
.toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 2000; display: flex; flex-direction: column; gap: 0.75rem; }
.toast { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 0.75rem; min-width: 280px; max-width: 400px; animation: slideIn 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
@keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: none; } }
.toast.success { border-left: 4px solid var(--accent); }
.toast.error { border-left: 4px solid var(--danger); }
.toast.warning { border-left: 4px solid var(--warning); }
.auth-page { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 2rem; }
.auth-card { width: 100%; max-width: 420px; }
.auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.auth-tab { flex: 1; padding: 1rem; text-align: center; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all var(--transition); }
.auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.setup-page { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 2rem; }
.setup-card { width: 100%; max-width: 500px; text-align: center; }
.setup-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.5rem; }
.profile-page { max-width: 800px; margin: 0 auto; }
.profile-header { display: flex; align-items: center; gap: 2rem; margin-bottom: 2rem; flex-wrap: wrap; }
.profile-avatar { width: 120px; height: 120px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 700; overflow: hidden; flex-shrink: 0; }
.profile-info h1 { font-size: 2rem; margin-bottom: 0.5rem; }
.profile-bio { color: var(--muted); }
.profile-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.profile-tab { padding: 0.75rem 1.5rem; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; } .profile-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.search-bar { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
.search-bar input { flex: 1; }
.pagination { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 2rem; }
.page-btn { width: 40px; height: 40px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); color: var(--muted); } .page-btn:hover { background: var(--bg-elevated); color: var(--fg); } .page-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
.hidden { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.footer { border-top: 1px solid var(--border); padding: 2rem 0; margin-top: 4rem; text-align: center; color: var(--muted); font-size: 0.9rem; }
.editor-toolbar { display: flex; gap: 0.25rem; flex-wrap: wrap; padding: 0.5rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm) var(--radius-sm) 0 0; margin-bottom: -1px; }
.editor-toolbar button { padding: 0.5rem; border-radius: 4px; color: var(--muted); } .editor-toolbar button:hover { background: var(--border); color: var(--fg); }
.editor-toolbar button.active { background: var(--accent-dim); color: var(--accent); }
#editor, #post-content { min-height: 300px; border-radius: 0 0 var(--radius-sm) var(--radius-sm); resize: vertical; font-family: var(--font-sans); line-height: 1.7; }
.image-upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; color: var(--muted); cursor: pointer; transition: all var(--transition); }
.image-upload-area:hover, .image-upload-area.dragover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.image-upload-area img { max-width: 100%; max-height: 200px; border-radius: var(--radius); }
.setup-steps { text-align: left; margin: 2rem 0; padding: 1.5rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); }
.setup-step { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; padding-left: 1.5rem; position: relative; }
.setup-step::before { content: ''; position: absolute; left: 0; top: 0.5rem; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.setup-step:last-child::after { display: none; }
.setup-step-text strong { display: block; margin-bottom: 0.25rem; }
.setup-step-text { color: var(--muted); font-size: 0.95rem; }
.badge-pending { background: #ffa50222; color: var(--warning); }
.badge-rejected { background: #ff475722; color: var(--danger); }
.nav-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 0.7rem; font-weight: 700; margin-left: 0.35rem; }
.quick-compose { margin-bottom: 2rem; border-color: var(--accent-dim); }
.quick-compose-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
.quick-compose-user { display: flex; align-items: center; gap: 0.75rem; }
.quick-compose textarea { min-height: 110px; resize: vertical; }
.quick-compose-extras { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--border); }
.quick-compose-actions { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
.sync-banner { background: #ffa50218; border: 1px solid var(--warning); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.activity-list { display: flex; flex-direction: column; gap: 0.75rem; }
.activity-item { display: flex; align-items: flex-start; gap: 0.85rem; padding: 1rem; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.activity-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
.activity-body { flex: 1; min-width: 0; }
.activity-meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }
.diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
@media (max-width: 768px) { .diff-grid { grid-template-columns: 1fr; } }
.diff-box { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; }
.diff-box.proposed { border-color: var(--accent); }
.diff-box h4 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.5rem; }
.diff-box.proposed h4 { color: var(--accent); }
.diff-content { white-space: pre-wrap; word-break: break-word; font-size: 0.9rem; max-height: 260px; overflow-y: auto; line-height: 1.6; }
.pill-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.pill-tab { padding: 0.45rem 0.95rem; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--muted); font-size: 0.85rem; font-weight: 600; transition: all var(--transition); }
.pill-tab.active, .pill-tab:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
</style>
</head>

<div class="container header-inner">

<a href="#/categories" data-nav>Kategoriler</a>
<a href="#/authors" data-nav>Kullanıcılar</a>

/* ==================== STATE & CONFIG ==================== */
const STORAGE_KEY = 'blog_data_v1';
let state = {

  categories: ['Genel', 'Teknoloji', 'Yaşam', 'Ödev'],
  settings: { title: 'Onii-sama blog', description: 'Onii-sama blog - Kardeşim için', footer: '', social: {} },

};
const GH_OWNER = 'Onii-sama-blog';
const GH_REPO = 'Onii-sama-blog.github.io';
const GH_BRANCH = 'main';
const GH_API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents`;
const GH_RAW = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}`;

let editingPostId = null;
let proposingPostId = null;

/* ==================== UTILITIES ==================== */
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const $$ = (sel, ctx=document) => [...ctx.querySelectorAll(sel)];
const esc = (str) => String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const panelBase = () => state.currentUser?.role === 'admin' ? '#/admin' : '#/settings';
const getPendingIncomingRequests = (u = state.currentUser) => {
  if(!u) return [];
  const reqs = Array.isArray(state.editRequests) ? state.editRequests : [];
  if(u.role === 'admin') return reqs.filter(r => r.status === 'pending');
  return reqs.filter(r => r.status === 'pending' && r.authorId === u.id);
};
const el = (tag, attrs={}, children=[]) => {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => k.startsWith('on') ? e.addEventListener(k.slice(2).toLowerCase(), v) : e.setAttribute(k,v));
  const list = Array.isArray(children) ? children : (children == null ? [] : [children]);
  list.forEach(c => { if(c != null) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
};
const html = (str) => {
  const t = document.createElement('template');
  t.innerHTML = str.trim();
  return t.content.childNodes.length === 1 ? t.content.firstChild : t.content;
};
const fmtDate = (ts) => new Date(ts).toLocaleDateString('tr-TR', { year:'numeric', month:'long', day:'numeric' });
const fmtDateTime = (ts) => new Date(ts).toLocaleString('tr-TR');
const slugify = (str) => str.toLowerCase().trim().replace(/[ğüşıöç]/g, c=>({ğ:'g',ü:'u',ş:'s',ı:'i',ö:'o',ç:'c'}[c])).replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
const uid = () => crypto.randomUUID();
const hashPass = async (pass) => { const enc = new TextEncoder().encode(pass + 'salt_blog_2026'); const buf = await crypto.subtle.digest('SHA-256', enc); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); };
const verifyPass = async (pass, hash) => hash === await hashPass(pass);
const toast = (msg, type='success') => { const c = $('#toast-container'); const t = el('div', {class:`toast ${type}`}, [el('span',{},[msg]), el('button',{class:'btn-ghost',onclick:()=>t.remove()},['✕'])]); c.append(t); setTimeout(()=>t.remove(), 5000); };
const showModal = (content) => { document.body.append(el('div',{class:'modal-overlay',onclick:e=>{if(e.target===e.currentTarget)e.currentTarget.remove()}},[el('div',{class:'modal'},[content])])); };
const closeModal = () => $('.modal-overlay')?.remove();
const applySiteMeta = () => {
  const title = state.settings?.title || 'Onii-sama blog';
  document.title = title;
  const logo = $('.logo'); if(logo) logo.textContent = title;
  const footer = $('#site-footer'); if(footer) footer.textContent = state.settings?.footer || title;
};
const setNav = () => {
  const u = state.currentUser;
  $('#nav-login')?.classList.toggle('hidden', !!u);
  const navAdmin = $('#nav-admin');
  if(navAdmin) {
    navAdmin.classList.toggle('hidden', !u);
    if(u) {
      const isAdmin = u.role === 'admin';

      navAdmin.setAttribute('href', isAdmin ? '#/admin' : '#/settings');
      navAdmin.innerHTML = `${isAdmin ? 'Admin Paneli' : 'Ayarlar'}${pendingCount ? `<span class="nav-badge" title="${pendingCount} bekleyen düzenleme isteği">${pendingCount}</span>` : ''}`;
    }
  }
  $('#nav-profile')?.classList.toggle('hidden', !u);
  $('#logout-btn')?.classList.toggle('hidden', !u);
  applySiteMeta();
};
const saveState = () => {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e){ console.error('Save failed',e); }
};
const loadState = () => {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if(s) state = {...state, ...JSON.parse(s)};
    if(!Array.isArray(state.activities)) state.activities = [];
    if(!Array.isArray(state.editRequests)) state.editRequests = [];
  } catch(e){ console.error('Load failed',e); }
};

/* ==================== GITHUB PAGES API (Public Read / Token or Proxy Write) ==================== */
function getGhToken() { return localStorage.getItem('gh_token') || ''; }
function setGhToken(t) { if(t) localStorage.setItem('gh_token', t); else localStorage.removeItem('gh_token'); }
function getProxyUrl() { return (state.settings?.proxyUrl || '').trim().replace(/\/+$/, ''); }
function hasWriteAccess() { return !!(getGhToken() || getProxyUrl()); }
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function base64ToUtf8(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function ghFetch(path, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  const token = getGhToken();
  const proxy = getProxyUrl();

  // Eğer ortak yazma sunucusu (Cloudflare Worker) ayarlıysa ve yerel token yoksa (veya yazma isteğiyse) proxy üzerinden git
  if(proxy && (method === 'PUT' || method === 'DELETE') && !token) {
    const cur = state.currentUser ? getUser(state.currentUser.id) : null;
    const r = await fetch(`${proxy}/gh`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        method,
        path,
        payload: options.body ? JSON.parse(options.body) : undefined,
        auth: cur ? { username: cur.username, passwordHash: cur.passwordHash } : null
      }),
      cache: 'no-store'
    });
    if(!r.ok) {
      const err = await r.text();
      throw new Error(`Sunucu ${r.status}: ${err}`);
    }
    return r.json();
  }

  const headers = { 'Accept': 'application/vnd.github.v3+json', ...(options.headers || {}) };
  if(options.body) headers['Content-Type'] = 'application/json';
  if(token) headers['Authorization'] = `Bearer ${token}`;
  const r = await fetch(`${GH_API}${path}`, { ...options, headers, cache: 'no-store' });
  if(!r.ok) {
    const err = await r.text();
    throw new Error(`GitHub API ${r.status}: ${err}`);
  }
  return r.json();
}

async function ghGetFile(path) {
  try {
    const data = await ghFetch(`/${path}?ref=${GH_BRANCH}`);
    if(data.type === 'dir') return null;
    const raw = base64ToUtf8(data.content);
    let parsed = raw;
    try { parsed = JSON.parse(raw); } catch {}
    return { content: parsed, sha: data.sha };
  } catch(e) {
    if(e.message.includes('404')) return null;
    throw e;
  }
}

async function ghListDir(path) {
  try {
    const data = await ghFetch(`/${path}?ref=${GH_BRANCH}`);
    if(!Array.isArray(data)) return [];
    return data.filter(f => f.name.endsWith('.txt')).map(f => f.name);
  } catch(e) {
    if(e.message.includes('404')) return [];
    throw e;
  }
}

async function ghPutFile(path, content, message, sha) {
  if(!sha) {
    const existing = await ghGetFile(path);
    if(existing) sha = existing.sha;
  }
  const serialized = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
  const body = {
    message,
    content: utf8ToBase64(serialized),
    branch: GH_BRANCH,
    ...(sha && { sha })
  };
  return ghFetch(`/${path}`, { method: 'PUT', body: JSON.stringify(body) });
}

async function ghDeleteFile(path, message, sha) {
  return ghFetch(`/${path}`, { method: 'DELETE', body: JSON.stringify({ message, sha, branch: GH_BRANCH }) });
}

async function ghReadJson(path, fallback = null) {
  try {
    const file = await ghGetFile(path);
    if(file && file.content !== undefined && typeof file.content !== 'string') return file.content;
  } catch(e) {}
  try {
    const r = await fetch(`${GH_RAW}/${path}?t=${Date.now()}`, { cache: 'no-store' });
    if(r.ok) return await r.json();
  } catch(e) {}
  return fallback;
}

async function loadFromGitHub() {
  try {
    const [postsFiles, usersFiles, commentsRaw, categoriesRaw, settingsRaw, activitiesRaw, editRequestsRaw] = await Promise.all([
      ghListDir('data/posts'),
      ghListDir('data/users'),
      ghReadJson('data/comments.txt', null),
      ghReadJson('data/categories.txt', null),
      ghReadJson('data/settings.txt', null),
      ghReadJson('data/activities.txt', null),
      ghReadJson('data/edit_requests.txt', null)
    ]);

    const posts = await Promise.all(postsFiles.map(f => ghReadJson(`data/posts/${f}`, null)));
    const users = await Promise.all(usersFiles.map(f => ghReadJson(`data/users/${f}`, null)));

    const validPosts = posts.filter(Boolean);
    const validUsers = users.filter(Boolean);
    if(validUsers.length || validPosts.length || settingsRaw) {
      // Yerel cihazda henüz GitHub'a gönderilmemiş (_unsynced) yazıları koru
      const localUnsynced = (state.posts || []).filter(p => p && p._unsynced);
      const remoteIds = new Set(validPosts.map(p => p.id));
      const mergedPosts = [...localUnsynced.filter(p => !remoteIds.has(p.id)), ...validPosts];
      state.posts = mergedPosts;
      if(validUsers.length) state.users = validUsers;
      if(Array.isArray(commentsRaw)) state.comments = commentsRaw;
      if(Array.isArray(categoriesRaw) && categoriesRaw.length) state.categories = categoriesRaw;
      if(settingsRaw) state.settings = { ...state.settings, ...settingsRaw };
      if(Array.isArray(activitiesRaw)) state.activities = activitiesRaw;
      if(Array.isArray(editRequestsRaw)) state.editRequests = editRequestsRaw;
      saveState();
    }
    return true;
  } catch(e) {
    console.warn('GitHub load failed, using localStorage fallback:', e);
    return false;
  }
}

async function savePostToGitHub(post) {
  if(!hasWriteAccess()) throw new Error('Yazma bağlantısı yok (Yönetici → Depolama / Token ayarlamalı)');
  const cleanPost = { ...post };
  delete cleanPost._unsynced;
  const res = await ghPutFile(`data/posts/${post.id}.txt`, cleanPost, `Update post ${post.id}`);
  delete post._unsynced;
  saveState();
  return res;
}

async function saveUserToGitHub(user) {
  if(!hasWriteAccess()) throw new Error('Yazma bağlantısı yok (Yönetici → Depolama / Token ayarlamalı)');
  return ghPutFile(`data/users/${user.id}.txt`, user, `Update user ${user.id}`);
}

async function saveSettingsToGitHub() {
  if(!hasWriteAccess()) throw new Error('Yazma bağlantısı yok (Yönetici → Depolama / Token ayarlamalı)');
  return ghPutFile('data/settings.txt', state.settings, 'Update settings');
}

async function saveCategoriesToGitHub() {
  if(!hasWriteAccess()) throw new Error('Yazma bağlantısı yok (Yönetici → Depolama / Token ayarlamalı)');
  return ghPutFile('data/categories.txt', state.categories, 'Update categories');
}

async function saveCommentsToGitHub() {
  if(!hasWriteAccess()) throw new Error('Yazma bağlantısı yok (Yönetici → Depolama / Token ayarlamalı)');
  return ghPutFile('data/comments.txt', state.comments, 'Update comments');
}

async function saveActivitiesToGitHub() {
  if(!hasWriteAccess()) return;
  return ghPutFile('data/activities.txt', state.activities, 'Update activities');
}

async function saveEditRequestsToGitHub() {
  if(!hasWriteAccess()) throw new Error('Yazma bağlantısı yok (Yönetici → Depolama / Token ayarlamalı)');
  return ghPutFile('data/edit_requests.txt', state.editRequests, 'Update edit requests');
}

async function logActivity(type, { summary, postId = null, postTitle = '', targetUserId = null } = {}) {
  const u = state.currentUser;
  if(!u) return;
  if(!Array.isArray(state.activities)) state.activities = [];
  state.activities.unshift({
    id: uid(),
    type,
    actorId: u.id,
    actorName: u.username,
    actorRole: u.role,
    targetUserId,
    postId,
    postTitle,
    summary,
    createdAt: Date.now()
  });
  state.activities = state.activities.slice(0, 300);
  saveState();
  if(hasWriteAccess()) {
    try { await saveActivitiesToGitHub(); } catch(e) { console.warn('Activity sync failed:', e); }
  }
}

async function syncUnsyncedPosts() {
  if(!hasWriteAccess()) {
    if(state.currentUser?.role === 'admin') {
      toast('Eşitlemek için önce Admin Paneli → Depolama / Token ayarını yapın', 'warning');
      navigate('#/admin?tab=storage');
    } else {
      toast('GitHub yazma bağlantısı henüz yönetici tarafından ayarlanmamış.', 'warning');
    }
    return;
  }
  const unsynced = state.posts.filter(p => p._unsynced);
  if(!unsynced.length) {
    toast('Tüm yazılar zaten GitHub ile eşitlenmiş!');
    return;
  }
  let okCount = 0;
  for(const p of unsynced) {
    try {
      await savePostToGitHub(p);
      okCount++;
    } catch(e) {
      toast(`"${p.title}" eşitlenemedi: ` + e.message, 'error');
    }
  }
  if(okCount) {
    try { await saveActivitiesToGitHub(); } catch {}
    toast(`${okCount} yazı GitHub'a eşitlendi! Artık tüm cihazlarda görünecek.`);
    renderRoute(currentRoute);
  }
}

async function deletePostFromGitHub(id) {
  if(!hasWriteAccess()) throw new Error('Yazma bağlantısı yok (Yönetici → Depolama / Token ayarlamalı)');
  const path = `data/posts/${id}.txt`;
  const existing = await ghGetFile(path);
  if(!existing) return;
  return ghDeleteFile(path, `Delete post ${id}`, existing.sha);
}

async function deleteUserFromGitHub(id) {
  if(!hasWriteAccess()) throw new Error('Yazma bağlantısı yok (Yönetici → Depolama / Token ayarlamalı)');
  const path = `data/users/${id}.txt`;
  const existing = await ghGetFile(path);
  if(!existing) return;
  return ghDeleteFile(path, `Delete user ${id}`, existing.sha);
}

async function initGitHubRepo() {
  const btn = $('#init-repo-btn');
  try {
    if(!hasWriteAccess()) return toast('Önce GitHub Token veya Ortak Yazma Sunucusu kaydedin', 'error');
    if(btn) { btn.disabled = true; btn.textContent = 'Eşitleniyor...'; }
    await ghPutFile('data/settings.txt', state.settings, 'Init/sync settings');
    await ghPutFile('data/categories.txt', state.categories, 'Init/sync categories');
    await ghPutFile('data/comments.txt', state.comments, 'Init/sync comments');
    await ghPutFile('data/activities.txt', state.activities || [], 'Init/sync activities');
    await ghPutFile('data/edit_requests.txt', state.editRequests || [], 'Init/sync edit requests');
    await ghPutFile('data/posts/.gitkeep', '', 'Init posts dir');
    await ghPutFile('data/users/.gitkeep', '', 'Init users dir');
    for(const u of state.users) {
      await ghPutFile(`data/users/${u.id}.txt`, u, `Sync user ${u.username}`);
    }
    for(const p of state.posts) {
      const cleanPost = { ...p };
      delete cleanPost._unsynced;
      await ghPutFile(`data/posts/${p.id}.txt`, cleanPost, `Sync post ${p.id}`);
      delete p._unsynced;
    }
    saveState();
    toast('Tüm veriler ve yerel yazılar GitHub\'a eşitlendi!');
  } catch(e) {
    console.error(e);
    toast('Eşitleme hatası: ' + e.message, 'error');
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = 'Repo Yapısını Başlat / Verileri GitHub\'a Eşitle'; }
  }
}

/* ==================== DATA HELPERS ==================== */
const getPost = (id) => state.posts.find(p => p.id === id);
const getUser = (id) => state.users.find(u => u.id === id);
const getCommentsForPost = (postId) => state.comments.filter(c => c.postId === postId);
const getPostsByCategory = (cat) => cat ? state.posts.filter(p => p.category === cat && p.status === 'published') : state.posts.filter(p => p.status === 'published');
const getPublishedPosts = () => state.posts.filter(p => p.status === 'published').sort((a,b)=>b.createdAt - a.createdAt);
const getUserPosts = (userId) => state.posts.filter(p => p.authorId === userId).sort((a,b)=>b.createdAt - a.createdAt);
const SITE_URL = 'https://onii-sama-blog.github.io/';
const formatWebsiteLink = (url) => {
  if(!url || !url.trim()) return '';
  const clean = url.trim();
  const href = /^https?:\/\//i.test(clean) ? clean : 'https://' + clean;
  return `<p style="margin-top:0.35rem;font-size:0.9rem">🌐 <a href="${href}" target="_blank" rel="noopener noreferrer">${clean}</a></p>`;
};
const avatarHtml = (u) => u?.avatar ? `<img src="${u.avatar}" alt="${u.username || ''}">` : (u?.username || '?')[0].toUpperCase();
const roleBadge = (role) => {
  const map = { admin: ['Yönetici', 'badge-admin'], editor: ['Editör', 'badge-editor'], author: ['Yazar', 'badge-published'] };
  const [label, cls] = map[role] || [role || 'Üye', 'badge-draft'];
  return `<span class="badge ${cls}">${label}</span>`;
};
function resizeAvatar(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Dosya okunamadı'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Geçersiz görsel'));
      img.onload = () => {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const min = Math.min(img.width, img.height);
        const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
        ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ==================== AUTH ==================== */
async function login(username, password) {
  const user = state.users.find(u => u.username === username);
  if(!user || !await verifyPass(password, user.passwordHash)) return false;
  state.currentUser = {...user, passwordHash: undefined};
  saveState(); setNav(); return true;
}
function logout() { state.currentUser = null; sessionStorage.removeItem('blog_session'); saveState(); setNav(); toast('Çıkış yapıldı'); navigate('#/'); }
async function register(username, password, role='author', silentNoToken=false) {
  if(state.users.some(u => u.username === username)) return {ok:false, msg:'Kullanıcı adı alınmış'};
  const user = { id:uid(), username, passwordHash:await hashPass(password), role, bio:'', avatar:'', website:'', createdAt:Date.now() };
  state.users.push(user); saveState();
  if(getGhToken()) {
    try { await saveUserToGitHub(user); } catch(e) { toast('GitHub kaydetme hatası: ' + e.message, 'error'); }
  } else if(!silentNoToken) {
    toast('Kullanıcı yerel kaydedildi. GitHub\'a yazmak için Admin → Depolama\'dan token girin.', 'warning');
  }
  return {ok:true, user:{...user, passwordHash:undefined}};
}
function requireAuth(roles=['admin','editor','author']) {
  if(!state.currentUser) { navigate('#/login'); return false; }
  if(!roles.includes(state.currentUser.role)) { toast('Yetkiniz yok', 'error'); return false; }
  return true;
}

/* ==================== ROUTER ==================== */
function navigate(hash) { location.hash = hash; }
window.addEventListener('hashchange', () => renderRoute(location.hash.slice(1) || '/'));
window.addEventListener('load', async () => {
  loadState();
  const ok = await loadFromGitHub();
  if(!ok) toast('GitHub\'dan yüklenemedi, yerel önbellek kullanılıyor', 'warning');
  applySiteMeta();
  if(state.users.length === 0) { setNav(); navigate('#/setup'); renderRoute('/setup'); return; }
  const session = sessionStorage.getItem('blog_session');
  if(session) { const u = state.users.find(x => x.id === session); if(u) state.currentUser = {...u, passwordHash:undefined}; }
  setNav();
  renderRoute(location.hash.slice(1) || '/');
});

/* ==================== RENDER ==================== */
function updateActiveNav(path) {
  const norm = path === '' ? '/' : path;
  $$('#nav a[data-nav]').forEach(a => {
    const href = (a.getAttribute('href') || '').replace(/^#/, '');
    const match =
      (href === '/' && norm === '/') ||
      (href === '/posts' && (norm === '/posts' || norm === '/post')) ||
      (href === '/categories' && (norm === '/categories' || norm === '/category')) ||
      (href === '/authors' && (norm === '/authors' || norm === '/author')) ||
      ((href === '/admin' || href === '/settings') && (norm === '/admin' || norm === '/settings')) ||
      (href !== '/' && href === norm);
    a.classList.toggle('active', match);
  });
}
function renderRoute(route) {
  currentRoute = route;
  const app = $('#app');
  const [path, query] = route.split('?');
  const params = new URLSearchParams(query || '');
  updateActiveNav(path);
  app.innerHTML = '';
  app.classList.remove('page-enter');
  void app.offsetWidth;
  app.classList.add('page-enter');
  window.scrollTo({ top: 0, behavior: 'instant' });

  if(path === '/setup') return renderSetup(app);
  if(path === '/login') return renderLogin(app);
  if(path === '/register') return renderRegister(app);
  if(path === '/admin' || path === '/settings') return renderPanel(app, path);
  if(path === '/profile') return renderProfile(app);
  if(path === '/post') return renderPost(app, params.get('id'));
  if(path === '/category' || path === '/categories') return renderCategory(app, params.get('name'));
  if(path === '/authors') return renderAuthorsList(app);
  if(path === '/author') return renderAuthor(app, params.get('id'));
  if(path === '/posts') return renderPostsList(app);
  if(path === '/about') return renderAbout(app);
  if(path === '/' || path === '') return renderHome(app);

function buildUnsyncedBanner() {
  if(!state.currentUser) return null;
  const unsynced = state.posts.filter(p => p._unsynced);
  if(!unsynced.length) return null;
  const canWrite = hasWriteAccess();
  const isAdmin = state.currentUser.role === 'admin';
  return html(`
    <div class="sync-banner">
      <div>
        <strong>⚠️ Bu cihazda GitHub'a gönderilmemiş ${unsynced.length} yazı var</strong>
        <p style="font-size:0.88rem;color:var(--muted);margin-top:0.2rem">
          ${canWrite
            ? 'Yazıların diğer cihazlarda (PC/mobil) görünmesi için GitHub\'a eşitleyin.'
            : (isAdmin
                ? 'Yazma bağlantısı aktif değil; Admin Paneli → Depolama / Token sekmesinden token veya ortak yazma sunucusu ayarlayın.'
                : 'Yazma bağlantısı yönetici tarafından henüz ayarlanmamış; bu yüzden yazı şimdilik sadece bu cihazda duruyor.')}
        </p>
      </div>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
        ${canWrite
          ? '<button class="btn btn-primary" onclick="syncUnsyncedPosts()">GitHub\'a Eşitle</button>'
          : (isAdmin ? '<a href="#/admin?tab=storage" class="btn btn-primary">Depolama / Token Ayarla</a>' : '')}
      </div>
    </div>
  `);
}

function renderPostsList(app) {
  const page = parseInt(new URLSearchParams(location.hash.split('?')[1]||'').get('page')||'1');

  const totalPages = Math.ceil(all.length / perPage);
  const posts = all.slice((page-1)*perPage, page*perPage);
  const section = el('div', {class:'container'});
  section.append(el('h1', {class:'section-title'}, 'Tüm Yazılar'));
  const grid = el('div', {class:'post-grid'});

    <header class="post-header">

        ${canProposeEdit ? `<a href="${panelBase()}?propose=${post.id}" class="btn btn-primary" style="font-size:0.85rem;padding:0.4rem 0.85rem">✏️ Düzenleme İsteği Gönder</a>` : ''}
        ${pendingCountForPost && u && (u.role==='admin' || u.id===post.authorId || u.role==='editor') ? `<a href="${panelBase()}?tab=edit-requests" class="badge badge-pending" style="text-decoration:none">⏳ ${pendingCountForPost} bekleyen düzenleme isteği</a>` : ''}
      </div>
    </header>
    ${post.coverImage ? `<img src="${post.coverImage}" alt="" class="post-cover">` : ''}
    <div class="post-content">${renderContent(post.content)}</div>
    <div class="post-tags">${(post.tags || []).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>

  section.append(article);
  if(comments.length || state.currentUser) {
    const commentsSection = el('section', {class:'comments-section'});

      commentsSection.append(html(`

        </form>
      `));
    } else {
      commentsSection.append(html(`<p style="color:var(--muted);margin-bottom:1rem">Yorum yazmak için <a href="#/login">giriş yapın</a>.</p>`));
    }
    const list = el('div', {class:'comment-list'});
    comments.forEach(c => {
      const u = getUser(c.userId);
      list.append(html(`
        <article class="comment">
          <div class="comment-header">
            <div class="comment-avatar">${avatarHtml(u)}</div>
            <div><strong>${u?.username || 'Misafir'}</strong> <span style="color:var(--muted);font-weight:400">${fmtDateTime(c.createdAt)}</span></div>
          </div>

        </article>

    section.append(commentsSection);
  }
  app.append(section);

    if(!userPosts.length) content.append(el('p', {style:'grid-column:1/-1;text-align:center;color:var(--muted)'}, 'Henüz yazınız yok.'));
  };
  const renderEdit = () => {
    let pendingAvatar = state.currentUser.avatar || '';
    const historyList = Array.from(new Set([SITE_URL, ...(state.currentUser.websiteHistory || []), ...(state.currentUser.website ? [state.currentUser.website] : [])].filter(Boolean)));
    content.innerHTML = `
      <form class="card" id="profile-edit-form" style="max-width:500px">
        <div class="form-group">
          <label>Profil Fotoğrafı</label>
          <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
            <div class="profile-avatar" id="avatar-preview" style="width:72px;height:72px;font-size:1.75rem">${avatarHtml(state.currentUser)}</div>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
              <button type="button" class="btn btn-secondary" id="avatar-pick-btn">Fotoğraf Seç</button>
              <button type="button" class="btn btn-danger ${pendingAvatar ? '' : 'hidden'}" id="avatar-remove-btn">Kaldır</button>
            </div>
            <input type="file" id="avatar-file-input" accept="image/*" class="visually-hidden">
          </div>
        </div>
        <div class="form-group"><label>Bio</label><textarea name="bio" rows="4">${state.currentUser.bio || ''}</textarea></div>
        <div class="form-group">
          <label>Web Sitesi</label>
          <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap">
            <select id="website-preset-select" style="flex:1;min-width:180px">
              <option value="">Kayıtlı sitelerden seç...</option>
              ${historyList.map(url => `<option value="${url}" ${url === state.currentUser.website ? 'selected' : ''}>${url === SITE_URL ? 'Bu blog (' + SITE_URL + ')' : url}</option>`).join('')}
            </select>
            <button type="button" class="btn btn-secondary" id="use-this-site-btn">Bu Siteyi Seç</button>
          </div>
          <input name="website" id="profile-website-input" value="${state.currentUser.website || ''}" placeholder="https://...">
        </div>
        <hr style="border-color:var(--border);margin:1.5rem 0">
        <div class="form-group"><label>Yeni Şifre (boş bırak = değişmez)</label><input name="newpass" type="password" autocomplete="new-password"></div>
        <div class="form-group"><label>Şifre Tekrar</label><input name="confirmpass" type="password" autocomplete="new-password"></div>
        <button type="submit" class="btn btn-primary" id="profile-save-btn">Kaydet</button>
      </form>
    `;
    const fileInput = $('#avatar-file-input');
    const preview = $('#avatar-preview');
    const removeBtn = $('#avatar-remove-btn');
    const websiteInput = $('#profile-website-input');
    const websiteSelect = $('#website-preset-select');
    websiteSelect.addEventListener('change', () => { if(websiteSelect.value) websiteInput.value = websiteSelect.value; });
    $('#use-this-site-btn').addEventListener('click', () => { websiteInput.value = SITE_URL; websiteSelect.value = SITE_URL; });
    $('#avatar-pick-btn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      if(file.size > 5 * 1024 * 1024) return toast('Fotoğraf 5MB\'dan büyük olamaz', 'error');
      try {
        pendingAvatar = await resizeAvatar(file);
        preview.innerHTML = `<img src="${pendingAvatar}" alt="">`;
        removeBtn.classList.remove('hidden');
        toast('Fotoğraf seçildi — kaydetmek için "Kaydet" butonuna basın', 'warning');
      } catch(err) {
        toast('Fotoğraf işlenemedi: ' + err.message, 'error');
      }
    });
    removeBtn.addEventListener('click', () => {
      pendingAvatar = '';
      fileInput.value = '';
      preview.innerHTML = state.currentUser.username[0].toUpperCase();
      removeBtn.classList.add('hidden');
    });
    $('#profile-edit-form').addEventListener('submit', async e => {
      e.preventDefault();
      const saveBtn = $('#profile-save-btn');
      const fd = new FormData(e.target);
      const bio = fd.get('bio'), website = (fd.get('website') || '').trim();
      const newpass = fd.get('newpass'), confirmpass = fd.get('confirmpass');
      const userIdx = state.users.findIndex(x => x.id === u.id);
      if(userIdx >= 0) {
        if(newpass && newpass !== confirmpass) return toast('Şifreler eşleşmiyor', 'error');
        if(saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Kaydediliyor...'; }
        state.users[userIdx].bio = bio;
        state.users[userIdx].website = website;
        const prevHist = Array.isArray(state.users[userIdx].websiteHistory) ? state.users[userIdx].websiteHistory : [];
        if(website && !prevHist.includes(website) && website !== SITE_URL) prevHist.unshift(website);
        state.users[userIdx].websiteHistory = prevHist.slice(0, 15);
        state.users[userIdx].avatar = pendingAvatar;
        if(newpass) state.users[userIdx].passwordHash = await hashPass(newpass);
        state.currentUser = {...state.users[userIdx], passwordHash:undefined};
        saveState();
        const headerAv = $('#profile-header-avatar');
        if(headerAv) headerAv.innerHTML = avatarHtml(state.currentUser);
        const headerBio = $('.profile-bio');
        if(headerBio) headerBio.textContent = bio || 'Bio yok';
        const headerWeb = $('#profile-header-website');
        if(headerWeb) headerWeb.innerHTML = formatWebsiteLink(website);
        if(hasWriteAccess()) {
          try {
            await saveUserToGitHub(state.users[userIdx]);
            await logActivity('profile_update', { summary: 'Profil bilgilerini güncelledi.' });
            toast('Profil ve fotoğraf GitHub\'a kaydedildi!');
          } catch(err) {
            toast('GitHub kaydetme hatası: ' + err.message, 'error');
          }
        } else {
          await logActivity('profile_update', { summary: 'Profil bilgilerini yerel olarak güncelledi.' });
          toast('Yerel kaydedildi (GitHub yazma bağlantısı henüz aktif değil)', 'warning');
        }
        renderEdit();
      }
    });
  };
  const switchTab = (tab) => {
    $$('.profile-tab').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
    if(tab==='posts') renderPosts();
    else if(tab==='edit') renderEdit();
    else if(tab==='panel') navigate(panelBase());
  };
  $$('.profile-tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  renderPosts();
}

function renderPanel(app, routePath = '/admin') {
  if(!requireAuth(['admin','editor','author'])) return;
  const u = state.currentUser;
  const isAdmin = u.role === 'admin';
  const queryStr = location.hash.split('?')[1] || '';
  const params = new URLSearchParams(queryStr);

  // Admin paneli sadece admin'e gözüksün; diğer kullanıcılar #/settings'e yönlendirilsin
  if(!isAdmin && routePath === '/admin') {
    const newParams = new URLSearchParams(params);
    const t = newParams.get('tab');
    if(!t || t === 'dashboard' || t === 'posts') newParams.set('tab', 'myposts');
    navigate('#/settings?' + newParams.toString());
    return;
  }
  if(isAdmin && routePath === '/settings') {
    navigate('#/admin' + (queryStr ? '?' + queryStr : ''));
    return;
  }

  const base = isAdmin ? '#/admin' : '#/settings';
  const editId = params.get('edit');
  const proposeId = params.get('propose');
  let tab = params.get('tab') || (isAdmin ? 'dashboard' : 'myposts');
  if(!isAdmin && (tab === 'dashboard' || tab === 'posts' || tab === 'categories' || tab === 'users' || tab === 'comments' || tab === 'settings' || tab === 'storage')) {
    tab = 'myposts';
  }
  if(isAdmin && tab === 'posts') tab = 'myposts';

  const pendingReqCount = getPendingIncomingRequests(u).length;
  const reqBadge = pendingReqCount ? `<span class="nav-badge">${pendingReqCount}</span>` : '';

  app.innerHTML = `
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="admin-sidebar-title">${isAdmin ? 'Admin Paneli' : 'Ayarlar'}</div>
        <nav class="admin-nav">
          ${isAdmin
            ? `<a href="${base}?tab=dashboard" data-tab="dashboard">📊 Dashboard</a>
               <a href="${base}?tab=activity" data-tab="activity">📜 Hareketler</a>
               <a href="${base}?tab=myposts" data-tab="myposts">✍️ Yazdıklarım</a>
               <a href="${base}?tab=edit-requests" data-tab="edit-requests">✏️ Düzenleme İstekleri ${reqBadge}</a>
               <a href="${base}?tab=categories" data-tab="categories">🏷️ Kategoriler</a>
               <a href="${base}?tab=users" data-tab="users">👥 Kullanıcılar</a>
               <a href="${base}?tab=comments" data-tab="comments">💬 Yorumlar</a>
               <a href="${base}?tab=settings" data-tab="settings">⚙️ Site Ayarları</a>
               <a href="${base}?tab=storage" data-tab="storage">💾 Depolama / Token</a>`
            : `<a href="${base}?tab=myposts" data-tab="myposts">✍️ Yazdıklarım</a>
               <a href="${base}?tab=edit-requests" data-tab="edit-requests">✏️ Düzenleme İstekleri ${reqBadge}</a>
               <a href="${base}?tab=activity" data-tab="activity">📜 Hareketlerim</a>`
          }
        </nav>
      </aside>
      <main class="admin-main" id="admin-main"></main>
    </div>
  `;
  const main = $('#admin-main');
  const syncBanner = buildUnsyncedBanner();
  if(syncBanner) main.append(syncBanner);
  const contentWrap = el('div');
  main.append(contentWrap);

  $$('.admin-nav a').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
  if(proposeId) return renderPostEditor(contentWrap, proposeId, { propose: true });
  if(editId) return renderPostEditor(contentWrap, editId, { propose: false });

  switch(tab) {
    case 'dashboard': if(isAdmin) renderDashboard(contentWrap); else renderMyPosts(contentWrap); break;
    case 'activity': renderActivityLog(contentWrap); break;
    case 'myposts': renderMyPosts(contentWrap); break;
    case 'edit-requests': renderEditRequests(contentWrap); break;
    case 'categories': if(isAdmin) renderCategoriesAdmin(contentWrap); break;
    case 'users': if(isAdmin) renderUsersAdmin(contentWrap); break;
    case 'comments': if(isAdmin) renderCommentsAdmin(contentWrap); break;
    case 'settings': if(isAdmin) renderSettingsAdmin(contentWrap); break;
    case 'storage': if(isAdmin) renderStorageAdmin(contentWrap); else renderMyPosts(contentWrap); break;
    default: isAdmin ? renderDashboard(contentWrap) : renderMyPosts(contentWrap);
  }
}

function renderDashboard(main) {
  const published = state.posts.filter(p=>p.status==='published').length;
  const drafts = state.posts.filter(p=>p.status==='draft').length;
  const users = state.users.length;
  const pendingReqs = (state.editRequests || []).filter(r=>r.status==='pending').length;
  const recentActs = (state.activities || []).slice(0, 8);
  main.innerHTML = `
    <div class="admin-header"><h1>Dashboard</h1><a href="#/admin?tab=myposts&new=1" class="btn btn-primary">Yeni Yazı</a></div>
    <div class="stat-grid">
      <div class="stat-card card"><div class="stat-icon">📝</div><div class="stat-info"><h3>Yayınlanan Yazılar</h3><p>${published}</p></div></div>
      <div class="stat-card card"><div class="stat-icon">📄</div><div class="stat-info"><h3>Taslaklar</h3><p>${drafts}</p></div></div>
      <div class="stat-card card"><div class="stat-icon">👥</div><div class="stat-info"><h3>Kullanıcılar</h3><p>${users}</p></div></div>
      <div class="stat-card card"><div class="stat-icon">✏️</div><div class="stat-info"><h3>Bekleyen İstekler</h3><p>${pendingReqs}</p></div></div>
    </div>
    <div class="card" style="margin-bottom:1.5rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem">
        <h3>Son Hareketler</h3>
        <a href="#/admin?tab=activity" class="btn btn-secondary" style="padding:0.4rem 0.8rem;font-size:0.85rem">Tümünü Gör</a>
      </div>
      ${recentActs.length
        ? `<div class="activity-list">${recentActs.map(renderActivityItemHtml).join('')}</div>`
        : '<p style="color:var(--muted)">Henüz kayıtlı hareket yok.</p>'}
    </div>
    <div class="card"><h3 style="margin-bottom:1rem">Son Yazılar</h3>
      <div class="table-wrap"><table><thead><tr><th>Başlık</th><th>Yazar</th><th>Durum</th><th>Kategori</th><th>Tarih</th><th></th></tr></thead><tbody>
        ${state.posts.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,10).map(p=>`<tr><td>${esc(p.title)} ${p._unsynced?'<span class="badge badge-pending">Yerel</span>':''}</td><td>${esc(getUser(p.authorId)?.username||'?')}</td><td><span class="badge ${p.status==='published'?'badge-published':'badge-draft'}">${p.status==='published'?'Yayınlandı':'Taslak'}</span></td><td>${esc(p.category)}</td><td>${fmtDate(p.createdAt)}</td><td><a href="#/admin?edit=${p.id}" class="btn btn-secondary action-btn">Düzenle</a></td></tr>`).join('')}
      </tbody></table></div>
      ${!state.posts.length ? '<p style="text-align:center;color:var(--muted);padding:1.5rem">Henüz yazı yok.</p>' : ''}
    </div>
  `;
}

function activityIcon(type) {
  const map = {
    post_create: '📝', post_edit: '✏️', post_delete: '🗑️',
    edit_request_create: '📨', edit_request_approve: '✅', edit_request_reject: '❌',
    comment_add: '💬', profile_update: '👤', user_create: '🆕', user_update: '🔧', settings_update: '⚙️'
  };
  return map[type] || '📌';
}

function renderActivityItemHtml(a) {
  const actor = getUser(a.actorId);
  const roleTag = actor ? roleBadge(actor.role) : (a.actorRole ? roleBadge(a.actorRole) : '');
  const postLink = a.postId && getPost(a.postId) ? `<a href="#/post?id=${a.postId}" style="font-size:0.82rem">Yazıya git →</a>` : '';
  return `
    <div class="activity-item">
      <div class="activity-icon">${activityIcon(a.type)}</div>
      <div class="activity-body">
        <div><strong>${esc(a.actorName || actor?.username || 'Kullanıcı')}</strong> ${roleTag} <span>${esc(a.summary)}</span></div>
        <div class="activity-meta">
          <span>${fmtDateTime(a.createdAt)}</span>
          ${postLink}
        </div>
      </div>
    </div>
  `;
}

function renderActivityLog(main) {
  const u = state.currentUser;
  const isAdmin = u.role === 'admin';
  const allActs = Array.isArray(state.activities) ? state.activities : [];
  const baseActs = isAdmin
    ? allActs
    : allActs.filter(a => a.actorId === u.id || a.targetUserId === u.id);

  let selectedUser = 'all';
  const renderList = () => {
    const filtered = (isAdmin && selectedUser !== 'all')
      ? baseActs.filter(a => a.actorId === selectedUser || a.targetUserId === selectedUser)
      : baseActs;
    const listEl = $('#activity-list-container', main);
    if(!listEl) return;
    listEl.innerHTML = filtered.length
      ? `<div class="activity-list">${filtered.map(renderActivityItemHtml).join('')}</div>`
      : '<p style="text-align:center;color:var(--muted);padding:2rem">Henüz kayıtlı hareket yok.</p>';
  };

  main.innerHTML = `
    <div class="admin-header">
      <div>
        <h1>${isAdmin ? 'Hareketler (Tüm Kullanıcılar)' : 'Hareketlerim'}</h1>
        <p style="color:var(--muted);font-size:0.9rem;margin-top:0.25rem">
          ${isAdmin
            ? 'Sitedeki tüm kullanıcıların yazı, yorum, profil ve düzenleme isteği hareketleri.'
            : 'Sadece senin yaptığın ve yazılarınla ilgili gerçekleşen hareketler.'}
        </p>
      </div>
      ${isAdmin ? `
        <div style="min-width:200px">
          <select id="activity-user-filter">
            <option value="all">Tüm Kullanıcılar</option>
            ${state.users.map(usr => `<option value="${usr.id}">${esc(usr.username)} (${usr.role})</option>`).join('')}
          </select>
        </div>
      ` : ''}
    </div>
    <div class="card" id="activity-list-container"></div>
  `;
  if(isAdmin) {
    $('#activity-user-filter', main).addEventListener('change', (e) => {
      selectedUser = e.target.value;
      renderList();
    });
  }
  renderList();
}

function renderMyPosts(main) {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  if(params.get('new')) return renderPostEditor(main, null, { propose: false });
  const u = state.currentUser;
  const isAdmin = u.role === 'admin';
  const scope = isAdmin && params.get('scope') === 'all' ? 'all' : 'mine';
  const visiblePosts = (scope === 'all' ? state.posts : getUserPosts(u.id)).slice().sort((a,b)=>b.createdAt-a.createdAt);
  const base = panelBase();

  main.innerHTML = `
    <div class="admin-header">
      <h1>${scope === 'all' ? 'Tüm Yazılar' : 'Yazdıklarım'}</h1>
      <a href="${base}?tab=myposts&new=1" class="btn btn-primary">Yeni Yazı</a>
    </div>
    ${isAdmin ? `
      <div class="pill-tabs">
        <a href="${base}?tab=myposts" class="pill-tab ${scope==='mine'?'active':''}">Benim Yazılarım (${getUserPosts(u.id).length})</a>
        <a href="${base}?tab=myposts&scope=all" class="pill-tab ${scope==='all'?'active':''}">Tüm Yazılar (${state.posts.length})</a>
      </div>
    ` : ''}
    <div class="card">
      <div class="table-wrap"><table><thead><tr><th>Başlık</th>${scope==='all'?'<th>Yazar</th>':''}<th>Kategori</th><th>Durum</th><th>Tarih</th><th></th></tr></thead><tbody>
        ${visiblePosts.map(p=>`
          <tr>
            <td><a href="#/post?id=${p.id}" style="color:inherit;font-weight:600">${esc(p.title)}</a> ${p._unsynced?'<span class="badge badge-pending">Yerel</span>':''}</td>
            ${scope==='all'?`<td>${esc(getUser(p.authorId)?.username||'?')}</td>`:''}
            <td>${esc(p.category)}</td>
            <td><span class="badge ${p.status==='published'?'badge-published':'badge-draft'}">${p.status==='published'?'Yayınlandı':'Taslak'}</span></td>
            <td>${fmtDate(p.createdAt)}</td>
            <td class="action-btns">
              <a href="${base}?edit=${p.id}" class="btn btn-secondary action-btn">Düzenle</a>
              <button class="btn btn-danger action-btn" onclick="deletePost('${p.id}')">Sil</button>
            </td>
          </tr>`).join('')}
      </tbody></table></div>
      ${!visiblePosts.length ? '<p style="text-align:center;color:var(--muted);padding:2rem">Henüz yazın yok. "Yeni Yazı" butonuna veya Anasayfa\'daki paylaşım kutusuna tıklayıp ilk yazını oluşturabilirsin.</p>' : ''}
    </div>
  `;
}

function renderEditRequests(main) {
  const u = state.currentUser;
  const isAdmin = u.role === 'admin';
  const isEditor = u.role === 'editor';
  const reqs = (state.editRequests || []).slice().sort((a,b) => b.createdAt - a.createdAt);

  const incoming = isAdmin ? reqs : reqs.filter(r => r.authorId === u.id);
  const outgoing = reqs.filter(r => r.editorId === u.id);
  const otherPublishedPosts = isEditor
    ? getPublishedPosts().filter(p => p.authorId !== u.id)
    : [];

  const statusBadge = (st) => {
    if(st === 'approved') return '<span class="badge badge-published">Kabul Edildi</span>';
    if(st === 'rejected') return '<span class="badge badge-rejected">Reddedildi</span>';
    return '<span class="badge badge-pending">Bekliyor</span>';
  };

  const renderReqCard = (r, canDecide) => {
    const post = getPost(r.postId);
    const author = getUser(r.authorId);
    const editor = getUser(r.editorId);
    const curTitle = post ? post.title : r.originalTitle;
    const curContent = post ? post.content : r.originalContent;
    const isPending = r.status === 'pending';
    return `
      <div class="card" style="margin-bottom:1rem">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap">
          <div>
            <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.35rem">
              ${statusBadge(r.status)}
              <strong>${esc(r.postTitle || curTitle)}</strong>
            </div>
            <div style="font-size:0.85rem;color:var(--muted)">
              Editör: <strong>${esc(editor?.username || r.editorName || '?')}</strong> → Yazar: <strong>${esc(author?.username || '?')}</strong> • ${fmtDateTime(r.createdAt)}
            </div>
            ${r.note ? `<p style="margin-top:0.5rem;padding:0.6rem 0.85rem;background:var(--bg-elevated);border-radius:var(--radius-sm);font-size:0.9rem">💬 <strong>Editör Notu:</strong> ${esc(r.note)}</p>` : ''}
          </div>
          <div class="action-btns" style="flex-wrap:wrap">
            ${canDecide && isPending ? `
              <button class="btn btn-primary action-btn" onclick="approveEditRequest('${r.id}')">✅ Kabul Et</button>
              <button class="btn btn-danger action-btn" onclick="rejectEditRequest('${r.id}')">❌ Reddet</button>
            ` : ''}
            ${!canDecide && isPending && r.editorId === u.id ? `
              <button class="btn btn-danger action-btn" onclick="cancelEditRequest('${r.id}')">İptal Et</button>
            ` : ''}
          </div>
        </div>
        <details style="margin-top:0.85rem">
          <summary style="cursor:pointer;color:var(--accent);font-weight:600;font-size:0.9rem">Değişiklikleri Karşılaştır (Eski / Önerilen)</summary>
          <div class="diff-grid">
            <div class="diff-box">
              <h4>Mevcut Yazı</h4>
              <p style="font-weight:700;margin-bottom:0.4rem">${esc(curTitle)}</p>
              <div class="diff-content">${esc(curContent)}</div>
            </div>
            <div class="diff-box proposed">
              <h4>Önerilen Düzenleme</h4>
              <p style="font-weight:700;margin-bottom:0.4rem">${esc(r.proposedTitle)}</p>
              <div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.4rem">Kategori: ${esc(r.proposedCategory)} ${r.proposedTags?.length ? '• Etiketler: ' + esc(r.proposedTags.join(', ')) : ''}</div>
              <div class="diff-content">${esc(r.proposedContent)}</div>
            </div>
          </div>
        </details>
      </div>
    `;
  };

  main.innerHTML = `
    <div class="admin-header">
      <div>
        <h1>Düzenleme İstekleri</h1>
        <p style="color:var(--muted);font-size:0.9rem;margin-top:0.25rem">
          Editörler paylaşılan yazılar için düzenleme isteği gönderir; yazar kabul ederse yazı otomatik güncellenir.
        </p>
      </div>
    </div>

async function approveEditRequest(reqId) {
  const req = (state.editRequests || []).find(r => r.id === reqId);
  if(!req || req.status !== 'pending') return;
  const u = state.currentUser;
  if(!u || (u.role !== 'admin' && u.id !== req.authorId)) return toast('Bu isteği onaylama yetkiniz yok', 'error');
  const post = getPost(req.postId);
  if(!post) return toast('İlgili yazı artık bulunamıyor', 'error');

  post.title = req.proposedTitle;
  post.category = req.proposedCategory;
  post.tags = Array.isArray(req.proposedTags) ? req.proposedTags : [];
  if(req.proposedCoverImage !== undefined) post.coverImage = req.proposedCoverImage;
  post.content = req.proposedContent;
  post.updatedAt = Date.now();

  req.status = 'approved';
  req.resolvedAt = Date.now();
  req.resolvedBy = u.id;
  saveState();

  try {
    await savePostToGitHub(post);
    await saveEditRequestsToGitHub();
    toast('Düzenleme isteği kabul edildi ve yazı GitHub\'da güncellendi!');
  } catch(e) {
    post._unsynced = true;
    saveState();
    toast('Değişiklik yerel olarak uygulandı ancak GitHub hatası: ' + e.message, 'warning');
  }
  await logActivity('edit_request_approve', {
    summary: `${req.editorName || 'Editör'} tarafından gönderilen "${post.title}" düzenleme isteğini kabul etti.`,
    postId: post.id, postTitle: post.title, targetUserId: req.editorId
  });
  setNav();
  renderRoute(currentRoute);
}

async function rejectEditRequest(reqId) {
  const req = (state.editRequests || []).find(r => r.id === reqId);
  if(!req || req.status !== 'pending') return;
  const u = state.currentUser;
  if(!u || (u.role !== 'admin' && u.id !== req.authorId)) return toast('Bu isteği reddetme yetkiniz yok', 'error');
  if(!confirm('Bu düzenleme isteğini reddetmek istiyor musunuz?')) return;

  req.status = 'rejected';
  req.resolvedAt = Date.now();
  req.resolvedBy = u.id;
  saveState();

  try {
    await saveEditRequestsToGitHub();
    toast('Düzenleme isteği reddedildi.');
  } catch(e) {
    toast('GitHub kaydetme hatası: ' + e.message, 'error');
  }
  await logActivity('edit_request_reject', {
    summary: `${req.editorName || 'Editör'} tarafından gönderilen "${req.postTitle}" düzenleme isteğini reddetti.`,
    postId: req.postId, postTitle: req.postTitle, targetUserId: req.editorId
  });
  setNav();
  renderRoute(currentRoute);
}

async function cancelEditRequest(reqId) {
  const req = (state.editRequests || []).find(r => r.id === reqId);
  if(!req || req.status !== 'pending') return;
  if(req.editorId !== state.currentUser?.id) return;
  if(!confirm('Gönderdiğiniz düzenleme isteğini iptal etmek istiyor musunuz?')) return;
  state.editRequests = state.editRequests.filter(r => r.id !== reqId);
  saveState();
  try { await saveEditRequestsToGitHub(); toast('Düzenleme isteği iptal edildi'); } catch(e) { toast('GitHub hatası: ' + e.message, 'error'); }
  setNav();
  renderRoute(currentRoute);
}

async function deletePost(id) {
  const post = getPost(id);
  if(!post) return;
  const u = state.currentUser;
  if(!u || (u.role !== 'admin' && post.authorId !== u.id)) return toast('Bu yazıyı silme yetkiniz yok', 'error');
  if(!confirm('Bu yazıyı silmek istiyor musunuz?')) return;
  state.posts = state.posts.filter(p => p.id !== id);
  saveState();
  try {
    await deletePostFromGitHub(id);
    toast('Yazı GitHub\'dan silindi');
  } catch(e) {
    toast('GitHub silme hatası: ' + e.message, 'error');
  }
  await logActivity('post_delete', {
    summary: `"${post.title}" başlıklı yazıyı sildi.`,
    postTitle: post.title
  });
  renderRoute(currentRoute);
}

  coverArea.addEventListener('dragleave', () => coverArea.classList.remove('dragover'));
  coverArea.addEventListener('drop', (e) => { e.preventDefault(); coverArea.classList.remove('dragover'); const file = e.dataTransfer.files[0]; if(file) processImage(file); });
  coverInput.addEventListener('change', (e) => { const file = e.target.files[0]; if(file) processImage(file); });

    reader.onload = ev => {
      uploadImageBase64 = ev.target.result;

      img.src = uploadImageBase64;
    };
    reader.readAsDataURL(file);
  }
}

async function savePost() {
  const btn = $('#save-post');
  const title = $('#post-title').value.trim();
  const content = $('#post-content').value;
  const category = $('#post-category').value;
  const status = $('#post-status').value;
  const tags = $('#post-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  if(!title || !content) return toast('Başlık ve içerik zorunlu', 'error');

  // Editör düzenleme isteği modu
  if(proposingPostId) {
    const orig = getPost(proposingPostId);
    if(!orig) return toast('Yazı bulunamadı', 'error');
    const note = ($('#edit-request-note')?.value || '').trim();
    if(btn) { btn.disabled = true; btn.textContent = 'Gönderiliyor...'; }
    const req = {
      id: uid(),
      postId: orig.id,
      postTitle: orig.title,
      authorId: orig.authorId,
      editorId: state.currentUser.id,
      editorName: state.currentUser.username,
      proposedTitle: title,
      proposedCategory: category,
      proposedTags: tags,
      proposedCoverImage: uploadImageBase64,
      proposedContent: content,
      note,
      originalTitle: orig.title,
      originalContent: orig.content,
      status: 'pending',
      createdAt: Date.now(),
      resolvedAt: null,
      resolvedBy: null
    };
    if(!Array.isArray(state.editRequests)) state.editRequests = [];
    state.editRequests.unshift(req);
    saveState();
    try {
      await saveEditRequestsToGitHub();
      toast('Düzenleme isteği yazara gönderildi! Yazar kabul ettiğinde yazı güncellenecek.');
    } catch(e) {
      toast('İstek yerel kaydedildi, GitHub hatası: ' + e.message, 'warning');
    }
    await logActivity('edit_request_create', {
      summary: `"${orig.title}" yazısı için düzenleme isteği gönderdi.`,
      postId: orig.id, postTitle: orig.title, targetUserId: orig.authorId
    });
    proposingPostId = null;
    setNav();
    navigate(`${panelBase()}?tab=edit-requests`);
    return;
  }

  if(btn) { btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  const now = Date.now();
  const isEdit = !!editingPostId;
  const post = isEdit ? getPost(editingPostId) : { id:uid(), authorId:state.currentUser.id, createdAt:now };
  if(post) {
    post.title = title; post.content = content; post.category = category; post.status = status; post.tags = tags; post.coverImage = uploadImageBase64; post.updatedAt = now;
    if(!isEdit) state.posts.unshift(post);
    saveState();
    try {
      await savePostToGitHub(post);
      toast(isEdit ? 'Yazı GitHub\'a kaydedildi!' : 'Yazı yayınlandı ve GitHub\'a kaydedildi!', 'success');
    } catch(e) {
      post._unsynced = true;
      saveState();
      toast('Yazı sadece bu cihaza kaydedildi! Diğer cihazlarda görünmesi için Depolama / Token sekmesinden GitHub token girin.', 'warning');
    }
    await logActivity(isEdit ? 'post_edit' : 'post_create', {
      summary: isEdit ? `"${post.title}" başlıklı yazıyı düzenledi.` : `"${post.title}" başlıklı yeni bir yazı ${status==='published'?'paylaştı':'taslak olarak kaydetti'}.`,
      postId: post.id, postTitle: post.title
    });
    navigate(`${panelBase()}?tab=myposts`);
  }
}
