        <div style="display:flex;gap:0.5rem;margin-top:0.6rem;flex-wrap:wrap">
          <button class="btn btn-primary" id="save-proxy-btn" onclick="saveProxyUrl()">Sunucu URL Kaydet</button>
          ${proxyUrl ? '<button class="btn btn-danger" onclick="clearProxyUrl()">Sunucuyu Kaldır</button>' : ''}
        </div>
      </div>

      <hr style="border-color:var(--border);margin:1.5rem 0">
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
        <button id="init-repo-btn" class="btn btn-secondary" onclick="initGitHubRepo()" ${!canWrite ? 'disabled style="opacity:0.5"' : ''}>Repo Yapısını Başlat / Verileri GitHub'a Eşitle</button>
        <button class="btn btn-secondary" onclick="downloadBackup()">JSON Yedek İndir</button>
        <button class="btn btn-secondary" onclick="document.getElementById('backup-input').click()">JSON Yedekten Geri Yükle</button>
        <input type="file" id="backup-input" accept=".json" class="visually-hidden" onchange="restoreBackup(event)">
      </div>
    </div>
  `;
}

async function saveGhToken() {
  const input = $('#gh-token-input');
  const btn = $('#save-token-btn');
  const raw = (input?.value || '').replace(/\s+/g, '');
  if(!raw || raw.startsWith('••')) return toast('Lütfen gerçek GitHub token kodunu yapıştırın', 'error');
  if(!raw.startsWith('ghp_') && !raw.startsWith('github_pat_')) {
    return toast('Geçersiz token formatı: "github_pat_" veya "ghp_" ile başlamalı (boşluksuz)', 'error');
  }
  if(btn) { btn.disabled = true; btn.textContent = 'Doğrulanıyor...'; }
  try {
    const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`, {
      headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${raw}` },
      cache: 'no-store'
    });
    if(r.status === 401) throw new Error('Token geçersiz veya süresi dolmuş (401). Yeni bir token oluşturun.');
    if(r.status === 404) throw new Error('Token bu repoya erişemiyor (404). Fine-Grained Token ayarında Onii-sama-blog.github.io reposunu seçin.');
    if(!r.ok) throw new Error(`GitHub doğrulama hatası (${r.status})`);
    const repo = await r.json();
    if(repo.permissions && repo.permissions.push === false) {
      throw new Error('Bu token\'ın yazma yetkisi yok! GitHub\'da "Contents: Read and write" iznini açın.');
    }
    setGhToken(raw);
    if(getGhToken() !== raw) throw new Error('Tarayıcı localStorage yazmaya izin vermiyor (Gizli sekme kapalı olmalı).');
    toast('✅ Token doğrulandı ve kaydedildi!');
    if(state.posts.some(p => p._unsynced)) {
      await syncUnsyncedPosts();
    } else {
      renderRoute(currentRoute);
    }
  } catch(e) {
    toast(e.message, 'error');
    if(btn) { btn.disabled = false; btn.textContent = 'Token Doğrula ve Kaydet'; }
  }
}

async function saveProxyUrl() {
  const raw = ($('#proxy-url-input')?.value || '').trim().replace(/\/+$/, '');
  if(!raw || !/^https:\/\/.+/i.test(raw)) return toast('Geçerli bir https:// sunucu adresi girin', 'error');
  const btn = $('#save-proxy-btn');
  if(btn) { btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  try {
    const ping = await fetch(`${raw}/health`, { cache: 'no-store' });
    if(!ping.ok) throw new Error(`Sunucu yanıt vermedi (${ping.status})`);
    state.settings.proxyUrl = raw;
    saveState();
    await saveSettingsToGitHub();
    toast('✅ Ortak yazma sunucusu kaydedildi! Artık tüm cihazlar ve kullanıcılar token olmadan yazabilir.');
    renderRoute(currentRoute);
  } catch(e) {
    toast('Sunucu bağlantısı doğrulanamadı: ' + e.message, 'error');
    if(btn) { btn.disabled = false; btn.textContent = 'Sunucu URL Kaydet'; }
  }
}

async function clearProxyUrl() {
  state.settings.proxyUrl = '';
  saveState();
  if(getGhToken()) { try { await saveSettingsToGitHub(); } catch {} }
  toast('Ortak yazma sunucusu kaldırıldı');
  renderRoute(currentRoute);
}

function clearGhToken() {
  setGhToken('');
  toast('Token silindi');
  renderRoute(currentRoute);
}

/* ==================== MODALS / ACTIONS ==================== */
async function addCategory() {
  const name = prompt('Kategori adı:');
  if(name && !state.categories.includes(name.trim())) { state.categories.push(name.trim()); saveState(); try { await saveCategoriesToGitHub(); } catch(e) { toast('GitHub kaydetme hatası: ' + e.message, 'error'); } renderRoute(currentRoute);}
}
async function editCategory(old) { const n = prompt('Yeni ad:', old); if(n && n!==old && !state.categories.includes(n)) { const i = state.categories.indexOf(old); state.categories[i]=n; state.posts.filter(p=>p.category===old).forEach(p=>p.category=n); saveState(); try { await saveCategoriesToGitHub(); } catch(e) { toast('GitHub kaydetme hatası: ' + e.message, 'error'); } renderRoute(currentRoute); } }
async function deleteCategory(cat) { if(confirm(`"${cat}" kategorisini sil? Yazılar "Genel"e taşınacak.`)) { state.posts.filter(p=>p.category===cat).forEach(p=>p.category='Genel'); state.categories = state.categories.filter(c=>c!==cat); if(!state.categories.length) state.categories=['Genel']; saveState(); try { await saveCategoriesToGitHub(); } catch(e) { toast('GitHub kaydetme hatası: ' + e.message, 'error'); } renderRoute(currentRoute); } }
function openUserModal(id=null) {
  const user = id ? getUser(id) : null;
  const isNew = !user;
  showModal(html(`
    <div class="modal-header"><h2 class="modal-title">${isNew?'Yeni Kullanıcı':`Düzenle: ${esc(user.username)}`}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><form id="user-form">
      ${isNew ? '<div class="form-group"><label>Kullanıcı Adı</label><input name="username" required></div>' : ''}
      <div class="form-group"><label>Rol</label><select name="role"><option value="author" ${user?.role==='author'?'selected':''}>Yazar</option><option value="editor" ${user?.role==='editor'?'selected':''}>Editör</option><option value="admin" ${user?.role==='admin'?'selected':''}>Admin</option></select></div>
      <div class="form-group"><label>Bio</label><textarea name="bio" rows="3">${esc(user?.bio||'')}</textarea></div>
      <div class="form-group"><label>Web Sitesi</label><input name="website" value="${esc(user?.website||'')}" placeholder="https://..."></div>
      ${isNew ? '<div class="form-group"><label>Şifre</label><input name="password" type="password" required autocomplete="new-password"></div>' : '<div class="form-group"><label>Yeni Şifre (boş = değiştirme)</label><input name="password" type="password" autocomplete="new-password"></div>'}
    </form></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">İptal</button><button class="btn btn-primary" onclick="saveUser('${id||''}')">Kaydet</button></div>
  `));
}
async function saveUser(id) {
  const fd = new FormData($('#user-form'));
  const username = fd.get('username'), role = fd.get('role'), bio = fd.get('bio'), website = fd.get('website'), password = fd.get('password');
  let targetUser = null;
  if(id) {
    const u = getUser(id); if(!u) return;
    u.role = role; u.bio = bio; u.website = website;
    if(password) u.passwordHash = await hashPass(password);
    if(u.id === state.currentUser.id) state.currentUser = {...u, passwordHash:undefined};
    targetUser = u;
  } else {
    if(state.users.some(x=>x.username===username)) return toast('Kullanıcı adı alınmış', 'error');
    const res = await register(username, password, role);
    if(!res.ok) return;
    const u = getUser(res.user.id); u.bio = bio; u.website = website;
    targetUser = u;
  }
  saveState();
  try {
    if(targetUser) await saveUserToGitHub(targetUser);
  } catch(e) { toast('GitHub kaydetme hatası: ' + e.message, 'error'); }
  if(targetUser) {
    await logActivity(id ? 'user_update' : 'user_create', {
      summary: id ? `"${targetUser.username}" kullanıcısını güncelledi (Rol: ${targetUser.role}).` : `"${targetUser.username}" kullanıcısını oluşturdu (Rol: ${targetUser.role}).`,
      targetUserId: targetUser.id
    });
  }
  closeModal(); renderRoute(currentRoute);
}
async function deleteUser(id) { if(confirm('Kullanıcıyı sil? Yazıları da silinir.')) { state.users = state.users.filter(u=>u.id!==id); state.posts = state.posts.filter(p=>p.authorId!==id); state.comments = state.comments.filter(c=>c.userId!==id); saveState(); try { await deleteUserFromGitHub(id); } catch(e) { toast('GitHub silme hatası: ' + e.message, 'error'); } renderRoute(currentRoute); } }
async function deleteComment(id) { if(confirm('Yorumu sil?')) { state.comments = state.comments.filter(c=>c.id!==id); saveState(); try { await saveCommentsToGitHub(); } catch(e) { toast('GitHub kaydetme hatası: ' + e.message, 'error'); } renderRoute(currentRoute); } }
async function addComment(postId, content) {
  if(!state.currentUser) return navigate('#/login');
  if(!content.trim()) return;
  const post = getPost(postId);
  const comment = { id:uid(), postId, userId:state.currentUser.id, content:content.trim(), createdAt:Date.now() };
  state.comments.push(comment); saveState();
  try { await saveCommentsToGitHub(); } catch(e) { toast('GitHub kaydetme hatası: ' + e.message, 'error'); }
  await logActivity('comment_add', {
    summary: `"${post?.title || 'bir yazı'}" yazısına yorum yaptı.`,
    postId, postTitle: post?.title || '', targetUserId: post?.authorId || null
  });
  renderRoute(currentRoute);
}
function downloadBackup() { const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `blog-backup-${Date.now()}.json`; a.click(); }
function restoreBackup(e) { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = ev => { try { const data = JSON.parse(ev.target.result); state = {...state, ...data}; saveState(); toast('Yedekten yüklendi'); renderRoute(currentRoute); } catch { toast('Geçersiz dosya', 'error'); } }; reader.readAsText(file); }


/* ==================== EDITOR HELPERS ==================== */
function handleTab(e) { if(e.key==='Tab') { e.preventDefault(); const {target, selectionStart, selectionEnd, value} = e.target; target.value = value.slice(0,selectionStart)+'  '+value.slice(selectionEnd); target.selectionStart = target.selectionEnd = selectionStart+2; } }
function applyFormat(fmt) { const ta = $('#post-content'); const {selectionStart, selectionEnd, value} = ta; if(selectionStart===selectionEnd) return; let before = value.slice(0,selectionStart), selected = value.slice(selectionStart,selectionEnd), after = value.slice(selectionEnd); let prefix='', suffix=''; switch(fmt){ case 'bold': prefix='**'; suffix='**'; break; case 'italic': prefix='*'; suffix='*'; break; case 'strike': prefix='~~'; suffix='~~'; break; case 'code': prefix='`'; suffix='`'; break; case 'pre': prefix='```\n'; suffix='\n```'; break; case 'h2': prefix='## '; break; case 'h3': prefix='### '; break; case 'ul': selected = selected.split('\n').map(l=>l?'- '+l:'').join('\n'); break; case 'ol': selected = selected.split('\n').map((l,i)=>l?`${i+1}. ${l}`:'').join('\n'); break; case 'quote': selected = selected.split('\n').map(l=>l?'> '+l:'').join('\n'); break; case 'link': { const url=prompt('URL:'); if(!url) return; prefix='['; suffix=`](${url})`; break; } case 'img': { const url=prompt('Görsel URL:'); if(!url) return; prefix='!['; suffix=`](${url})`; break; } } ta.value = before + prefix + selected + suffix + after; ta.focus(); ta.selectionStart = selectionStart + prefix.length; ta.selectionEnd = selectionStart + prefix.length + selected.length; }
function stripHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function fmtReadingTime(html) { const words = stripHtml(html).split(/\s+/).length; const mins = Math.max(1, Math.round(words/200)); return `${mins} dk`; }
function renderContent(raw) {
  // Basit markdown-benzeri parser
  let html = raw
    .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^\- (.+)$/gm, '<li>$1</li>')
    .replace(/(^|\n)(<li>.*<\/li>)+/g, '$1<ul>$&</ul>')
    .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:var(--radius);margin:1rem 0">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/~~(.+?)~~/g, '<s>$1</s>')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}
function createPostCard(post, editMode=false) {
  const author = getUser(post.authorId);
  const editHref = `${panelBase()}?edit=${post.id}`;
  const card = el('article', {class:'card post-card'});
  card.innerHTML = `
    ${post.coverImage ? `<img src="${post.coverImage}" alt="">` : ''}
    <div class="post-card-content">
      <div class="post-card-meta">
        <span>${fmtDate(post.createdAt)}</span>
        <span>${esc(post.category)}</span>
        <span>${fmtReadingTime(post.content)}</span>
        ${post.status==='draft' ? '<span class="badge badge-draft">Taslak</span>' : ''}
        ${post._unsynced ? '<span class="badge badge-pending">Yerel</span>' : ''}
      </div>
      <h2 class="post-card-title"><a href="${editMode ? editHref : '#/post?id='+post.id}" style="color:inherit">${esc(post.title)}</a></h2>
      <p class="post-card-excerpt">${esc(stripHtml(renderContent(post.content)).slice(0,150))}…</p>
      <div class="post-card-footer"><span>${esc(author?.username || 'Bilinmiyor')}</span>${editMode ? `<a href="${editHref}" class="btn btn-secondary action-btn">Düzenle</a>` : `<a href="#/post?id=${post.id}" class="btn btn-secondary" style="font-size:0.8rem">Oku</a>`}</div>
    </div>`;
  return card;
}
function renderPagination(current, total, base) {
  const nav = el('nav', {class:'pagination', 'aria-label':'Sayfalama'});
  if(current > 1) nav.append(el('a', {class:'page-btn', href:`#/${base}?page=${current-1}`}, '‹'));
  for(let i=1;i<=total;i++) {
    if(i===1 || i===total || Math.abs(i-current)<=1) {
      nav.append(el('a', {class:`page-btn ${i===current?'active':''}`, href:i===current?'#':`#/${base}?page=${i}`}, i));
    } else if(i===current-2 || i===current+2) {
      nav.append(el('span', {class:'page-btn', style:'pointer-events:none;opacity:.5'}, '…'));
    }
  }
  if(current < total) nav.append(el('a', {class:'page-btn', href:`#/${base}?page=${current+1}`}, '›'));
  return nav;
}

const THEME_KEY = 'blog_theme';
function getEffectiveTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if(saved === 'light' || saved === 'dark') return saved;
  return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
function applyTheme(theme) {
  if(theme === 'light' || theme === 'dark') {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(THEME_KEY, theme);
  } else {
    document.documentElement.removeAttribute('data-theme');
    localStorage.removeItem(THEME_KEY);
  }
  const eff = getEffectiveTheme();
  const btn = $('#theme-toggle');
  if(btn) {
    btn.textContent = eff === 'dark' ? '☀️' : '🌙';
    btn.title = eff === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç';
  }
}
applyTheme(localStorage.getItem(THEME_KEY));
$('#theme-toggle').addEventListener('click', () => {
  const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
  applyTheme(next);
});
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if(!localStorage.getItem(THEME_KEY)) applyTheme(null);
});
